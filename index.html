<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>吉他社考勤/名单管理</title>
  <style>
    body { font-family: sans-serif; margin: 20px; line-height: 1.6; }
    button { padding: 8px 16px; margin-bottom: 15px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f4f4f4; }
  </style>
</head>
<body>

  <h2>吉他社人员名单 / 考勤数据</h2>
  <button onclick="loadData()">加载/刷新数据</button>

  <div id="status">点击按钮加载数据...</div>

  <table id="dataTable" style="display:none;">
    <thead>
      <tr id="tableHead"></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    // 你的 Apps Script 部署链接
    const API_URL = "https://script.google.com/macros/s/AKfycbxZrmAuLq1WnQefXsspTJD206bPg1WrJHlnxlI-YiESy0MM9V036JKwgaagax8HjEClqQ/exec";

    function loadData() {
      const statusDiv = document.getElementById("status");
      statusDiv.innerText = "正在读取数据，请稍候...";

      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          statusDiv.innerText = "数据读取成功！";
          renderTable(data);
        })
        .catch(err => {
          console.error(err);
          statusDiv.innerText = "读取失败，请检查控制台或 Apps Script 部署设置（确保权限设为 Anyone）。";
        });
    }

    function renderTable(data) {
      const table = document.getElementById("dataTable");
      const head = document.getElementById("tableHead");
      const body = document.getElementById("tableBody");

      head.innerHTML = "";
      body.innerHTML = "";

      if (!data || data.length === 0) {
        document.getElementById("status").innerText = "暂无数据";
        return;
      }

      // 如果返回的是二维数组 (像 Google Sheet 行列)
      if (Array.isArray(data[0])) {
        // 第一行为表头
        data[0].forEach(col => {
          head.innerHTML += `<th>${col}</th>`;
        });
        // 后面为数据内容
        for (let i = 1; i < data.length; i++) {
          let tr = "<tr>";
          data[i].forEach(cell => {
            tr += `<td>${cell}</td>`;
          });
          tr += "</tr>";
          body.innerHTML += tr;
        }
      } else {
        // 如果返回的是对象数组
        const keys = Object.keys(data[0]);
        keys.forEach(k => head.innerHTML += `<th>${k}</th>`);
        data.forEach(row => {
          let tr = "<tr>";
          keys.forEach(k => tr += `<td>${row[k] || ''}</td>`);
          tr += "</tr>";
          body.innerHTML += tr;
        });
      }

      table.style.display = "table";
    }
  </script>
</body>
</html>
